repositories:
  - id: mavenLocal
    url: mavenLocal
    resolve: true
  - id: maven-central
    url: https://repo.maven.apache.org/maven2

settings:
  kotlin:
    version: 2.4.10
    allWarningsAsErrors: true
    serialization: enabled
  jvm:
    jdk:
      version: 17
    release: 17
    test:
      junitPlatformVersion: 1.13.4

test-dependencies:
  - $libs.kotlin.test
