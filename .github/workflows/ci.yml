name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.context }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        context:
          - standalone
          - embedded
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare standalone or embedded workspace
        id: workspace
        shell: bash
        env:
          CONTEXT: ${{ matrix.context }}
        run: |
          if [[ "$CONTEXT" == "standalone" ]]; then
            echo "source=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
            echo "project=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          host="$RUNNER_TEMP/code-studio-host"
          mkdir -p "$host"
          git -C "$host" init -q -b main
          git -C "$host" -c protocol.file.allow=always submodule add "$GITHUB_WORKSPACE" studio
          git -C "$host/studio" checkout --detach "$GITHUB_SHA"
          cp "$host/studio/libs.versions.toml" "$host/libs.versions.toml"
          fixture="$GITHUB_WORKSPACE/.github/fixtures/embedded"
          cp "$fixture/project.yaml" "$host/project.yaml"
          cp -R "$fixture/sample" "$host/sample"
          mkdir -p "$host/.code-studio"
          cp "$fixture/code-studio/"* "$host/.code-studio/"
          echo "source=$host/studio" >> "$GITHUB_OUTPUT"
          echo "project=$host" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install CLI dependencies
        working-directory: ${{ steps.workspace.outputs.source }}/packages/cli
        run: npm ci

      - name: Check Kotlin standalone project
        if: matrix.context == 'standalone'
        working-directory: ${{ steps.workspace.outputs.project }}
        run: ./kotlin check

      - name: Build Wasm release
        if: matrix.context == 'standalone'
        working-directory: ${{ steps.workspace.outputs.source }}
        run: ./kotlin build -m web -p wasmJs -v release

      - name: Verify embedded Wasm resources
        if: matrix.context == 'standalone'
        working-directory: ${{ steps.workspace.outputs.source }}
        shell: bash
        run: |
          ./kotlin build -m server -p jvm
          jar_file=build/tasks/_server_jarJvm/server-jvm.jar
          jar tf "$jar_file" | grep -Fx studio/index.html
          jar tf "$jar_file" | grep -Fx studio/web.wasm
          jar tf "$jar_file" | grep -Fx studio/web.mjs
          jar tf "$jar_file" | grep -Fx studio/skiko.wasm
          jar tf "$jar_file" | grep -Fx studio/skiko.mjs
          jar tf "$jar_file" | grep -Fx studio/import-map-loader.js
          jar tf "$jar_file" | grep -Fx studio/vendors/@js-joda/core/dist/js-joda.esm.js

      - name: Check zero-application bootstrap
        if: matrix.context == 'standalone'
        shell: bash
        run: |
          host="$RUNNER_TEMP/code-studio-zero-app"
          mkdir -p "$host"
          ln -s "$GITHUB_WORKSPACE" "$host/studio"
          node packages/cli/bin/code-studio.js init "$host" --yes --skip-submodule
          test -f "$host/.run/Code Studio - Create Application.run.xml"
          cd "$host"
          node studio/packages/cli/bin/code-studio.js add app example-app
          test ! -f ".run/Code Studio - Create Application.run.xml"
          ./kotlin build --build-dir "$RUNNER_TEMP/code-studio-zero-app-build" -m example-app
          jar tf "$RUNNER_TEMP/code-studio-zero-app-build/tasks/_example-app_jarJvm/example-app-jvm.jar" | grep -Fx META-INF/code-studio/contributor.json

      - name: Check Kotlin embedded project
        if: matrix.context == 'embedded'
        working-directory: ${{ steps.workspace.outputs.project }}
        run: |
          ./studio/kotlin check --project-dir=.
          test -f build/tasks/_sample_generateCodeStudioSources@source-generation/example/catalog/generated/entity/ExampleSource.kt

      - name: Check forbidden dependencies and removed frontend
        working-directory: ${{ steps.workspace.outputs.source }}
        shell: bash
        run: |
          dependencies="$(./kotlin show dependencies -a)"
          ! grep -Eiq 'cn\.hutool|fastexcel|autopoi' <<< "$dependencies"
          test ! -d ui
          test -z "$(git ls-files 'ui/**' '*vite*' '*vitest*' 'pnpm-*')"

      - name: Test CLI
        working-directory: ${{ steps.workspace.outputs.source }}/packages/cli
        run: npm test
