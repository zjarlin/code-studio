product: jvm/lib

description: 提供报表与电子表格模板的存储、编译、填充和 HTTP API。

apply:
  - ../../build-config/common-jvm.module-template.yaml

plugins:
  report-ui:
    enabled: true

dependencies:
  - ../metadata-contract: exported
  - ../server: exported
  - $libs.jackson.databind
  - $libs.jackson.module.kotlin
  - $libs.flyway.core
  - $libs.flyway.postgresql: runtime-only
  - $libs.kotlinx.coroutines.core
  - $libs.kotlinx.serialization.json
  - $libs.koin.annotations
  - $libs.koin.core
  - $libs.ktor.server.core
  - $libs.poi.ooxml
  - $libs.postgresql: runtime-only

test-dependencies:
  - $libs.ktor.serialization.jackson3
  - $libs.ktor.server.content.negotiation
  - $libs.ktor.server.test.host

settings:
  kotlin:
    compilerPlugins:
      - id: io.insert-koin.compiler.plugin
        dependency: $libs.koin.compiler.plugin
        options:
          compileSafety: "true"
          unsafeDslChecks: "true"
          skipDefaultValues: "true"
          moduleId: ":studio:modules:report"
          logSeverity: info
          versionCheckSeverity: info
