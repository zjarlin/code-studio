product:
  type: kmp/lib
  platforms: [jvm, wasmJs]

description: Studio 的跨平台工作台 UI、状态、导航和交互。

apply:
  - ../../build-config/common-kmp.module-template.yaml

dependencies:
  - ../metadata-contract: exported
  - bom: $libs.koin.bom
  - $libs.koin.core
  - $libs.koin.annotations
  - $libs.koin.compose
  - $libs.kotlinx.coroutines.core
  - $libs.kotlinx.serialization.json
  - $libs.ktor.client.core
  - $libs.ktor.client.content.negotiation
  - $libs.ktor.serialization.kotlinx.json
  - $libs.compose.runtime
  - $libs.compose.foundation
  - $libs.compose.ui
  - $libs.compose.material3
  - $libs.compose.icons
  - $libs.compose.resources

test-dependencies:
  - $libs.kotlinx.coroutines.test
  - $libs.ktor.client.mock

settings:
  kotlin:
    allWarningsAsErrors: false
    compilerPlugins:
      - id: io.insert-koin.compiler.plugin
        dependency: io.insert-koin:koin-compiler-plugin:1.0.1
        options:
          compileSafety: "false"
          debugLogs: "false"
          skipDefaultValues: "true"
          unsafeDslChecks: "true"
          userLogs: "true"
  compose:
    enabled: true
    version: 1.12.0-beta03
    resources:
      packageName: site.addzero.studio.workbench.generated.resources
