product: jvm/lib

description: 为应用初始壳和无启动类的 library 提供通用开发宿主。

apply:
  - ../../build-config/common-jvm.module-template.yaml

dependencies:
  - ../metadata-service
  - ../report
  - ../server
  - $libs.hikari
  - $libs.ktor.serialization.jackson3
  - $libs.ktor.server.config.yaml
  - $libs.ktor.server.content.negotiation
  - $libs.ktor.server.netty
  - $libs.logback.classic
  - $libs.koin.ktor
  - $libs.postgresql: runtime-only

test-dependencies:
  - $libs.jackson.module.kotlin
  - $libs.ktor.server.test.host

settings:
  kotlin:
    compilerPlugins:
      - id: io.insert-koin.compiler.plugin
        dependency: $libs.koin.compiler.plugin
        options:
          compileSafety: "true"
          unsafeDslChecks: "true"
          skipDefaultValues: "true"
          moduleId: ":studio:modules:development-host"
          logSeverity: info
          versionCheckSeverity: info
