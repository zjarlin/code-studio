tasks:
  compileCodeStudioSources:
    action: !site.addzero.toolchain.lowcode.compileLowcodeSources
      contributorManifest: "${module.rootDir}/src/main/resources/META-INF/code-studio/contributor.json"
      generationTargetProfile: ${pluginSettings.generationTargetProfile}
      metadataSnapshot: "${module.rootDir}/src/main/lowcode-metadata/metadata.json"
      sourceMetadataSnapshots:
        ${pluginSettings.sourceMetadataSnapshots}
      contributorIndex: ${pluginSettings.contributorIndex}
      contributorClasspath: ${pluginSettings.contributorClasspath}
      compiledSourceDirectory: "${taskOutputDir}/compiled"
      scaffoldSourceDirectory: "${taskOutputDir}/scaffolds"
  generateCodeStudioSources:
    action: !site.addzero.toolchain.lowcode.validateLowcodeSources
      compiledSourceDirectory: ${tasks.compileCodeStudioSources.action.compiledSourceDirectory}
      scaffoldSourceDirectory: ${tasks.compileCodeStudioSources.action.scaffoldSourceDirectory}
      sourceDirectory: "${module.rootDir}/src/main/kotlin"
      generatedSourceDirectory: ${taskOutputDir}
  packageCodeStudioContributor:
    action: !site.addzero.toolchain.lowcode.packageContributorMetadata
      contributorMetadataMigrationDirectory: "${module.rootDir}/src/main/lowcode-metadata/db/studio/migration"
      generationTargetProfile: ${pluginSettings.generationTargetProfile}
      metadataSnapshot: "${module.rootDir}/src/main/lowcode-metadata/metadata.json"
      moduleResourcesDirectory: "${module.rootDir}/src/main/resources"
      generatedResourcesDirectory: ${taskOutputDir}
  refreshCodeStudioMetadata:
    action: !site.addzero.toolchain.lowcode.refreshLowcodeMetadata
      currentContributorManifest: "${module.rootDir}/src/main/resources/META-INF/code-studio/contributor.json"
      currentContributorMigrationDirectory: "${module.rootDir}/src/main/lowcode-metadata/db/studio/migration"
      contributorIndex: ${pluginSettings.contributorIndex}
      contributorClasspath: ${pluginSettings.contributorClasspath}
      platformMigrationDirectory: ${pluginSettings.platformMigrationDirectory}
      developmentDatabaseConfig: ${pluginSettings.developmentDatabaseConfig}
      metadataSnapshot: "${module.rootDir}/src/main/lowcode-metadata/metadata.json"
      publishedContributorDirectory: "${taskOutputDir}/published-contributors"
  generateCodeStudioMigration:
    action: !site.addzero.toolchain.lowcode.generateLowcodeMigration
      currentContributorManifest: "${module.rootDir}/src/main/resources/META-INF/code-studio/contributor.json"
      currentContributorMigrationDirectory: "${module.rootDir}/src/main/lowcode-metadata/db/studio/migration"
      contributorIndex: ${pluginSettings.contributorIndex}
      contributorClasspath: ${pluginSettings.contributorClasspath}
      platformMigrationDirectory: ${pluginSettings.platformMigrationDirectory}
      publishedContributorDirectory: "${taskOutputDir}/published-contributors"
      generatedMigrationDirectory: "${taskOutputDir}/candidate"
  codeStudioSync:
    action: !site.addzero.toolchain.lowcode.materializeLowcodeSources
      contributorManifest: "${module.rootDir}/src/main/resources/META-INF/code-studio/contributor.json"
      generationTargetProfile: ${pluginSettings.generationTargetProfile}
      metadataSnapshot: "${module.rootDir}/src/main/lowcode-metadata/metadata.json"
      sourceDirectory: "${module.rootDir}/src/main/kotlin"
  verifyCodeStudioSchema:
    action: !site.addzero.toolchain.lowcode.verifyLowcodeSchema
      currentContributorManifest: "${module.rootDir}/src/main/resources/META-INF/code-studio/contributor.json"
      currentContributorMigrationDirectory: "${module.rootDir}/src/main/lowcode-metadata/db/studio/migration"
      contributorIndex: ${pluginSettings.contributorIndex}
      contributorClasspath: ${pluginSettings.contributorClasspath}
      platformMigrationDirectory: ${pluginSettings.platformMigrationDirectory}
      publishedContributorDirectory: "${taskOutputDir}/published-contributors"

commands:
  - generateCodeStudioMigration
  - packageCodeStudioContributor
  - refreshCodeStudioMetadata
  - codeStudioSync
  - verifyCodeStudioSchema

generated:
  resources:
    - directory: ${tasks.packageCodeStudioContributor.action.generatedResourcesDirectory}
  sources:
    - language: kotlin
      directory: ${tasks.generateCodeStudioSources.action.generatedSourceDirectory}
