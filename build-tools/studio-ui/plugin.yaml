tasks:
  buildStudioUi:
    action: !site.addzero.toolchain.lowcode.buildLowcodeStudio
      kotlinWrapper: ${module.rootDir}/../../kotlin
      projectFile: ${module.rootDir}/../../project.yaml
      versionCatalog: ${module.rootDir}/../../libs.versions.toml
      webModule: ${module.rootDir}/../../apps/web
      workbenchModule: ${module.rootDir}/../../modules/workbench
      contractModule: ${module.rootDir}/../../modules/metadata-contract
      generatedResourcesDirectory: ${taskOutputDir}/generated-resources

generated:
  resources:
    - directory: ${tasks.buildStudioUi.action.generatedResourcesDirectory}
